global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: rdps-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3001]

  - job_name: rdps-api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://api:3001/api/v1/health/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: rdps-web-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://web:8080/healthz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis-exporter
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
