name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rdps
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d rdps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/rdps?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: "3001"
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-with-at-least-32-bytes
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret-with-at-least-32-bytes
      RDPS_IMAGE_TAG: ci-validation
      RDPS_GHCR_OWNER: example
      RDPS_API_IMAGE: ghcr.io/example/rdps-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      RDPS_WORKER_IMAGE: ghcr.io/example/rdps-worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      RDPS_MIGRATE_IMAGE: ghcr.io/example/rdps-migrate@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      RDPS_WEB_IMAGE: ghcr.io/example/rdps-web@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      RDPS_ALERTMANAGER_IMAGE: ghcr.io/example/rdps-alertmanager@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      CLAMAV_IMAGE: ghcr.io/example/clamav@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      CLAMAV_IMAGE_REPOSITORY: ghcr.io/example/clamav
      POSTGRES_IMAGE: docker.io/library/postgres@sha256:1111111111111111111111111111111111111111111111111111111111111111
      REDIS_IMAGE: docker.io/library/redis@sha256:2222222222222222222222222222222222222222222222222222222222222222
      PROMETHEUS_IMAGE: quay.io/prometheus/prometheus@sha256:3333333333333333333333333333333333333333333333333333333333333333
      POSTGRES_EXPORTER_IMAGE: quay.io/prometheuscommunity/postgres-exporter@sha256:4444444444444444444444444444444444444444444444444444444444444444
      REDIS_EXPORTER_IMAGE: ghcr.io/oliver006/redis_exporter@sha256:5555555555555555555555555555555555555555555555555555555555555555
      BLACKBOX_EXPORTER_IMAGE: quay.io/prometheus/blackbox-exporter@sha256:6666666666666666666666666666666666666666666666666666666666666666
      NODE_EXPORTER_IMAGE: quay.io/prometheus/node-exporter@sha256:7777777777777777777777777777777777777777777777777777777777777777
      POSTGRES_DB: rdps
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-postgres-password-with-at-least-32-bytes
      POSTGRES_EXPORTER_USER: ci_exporter
      POSTGRES_EXPORTER_PASSWORD: ci-only-exporter-password-with-at-least-32-bytes
      REDIS_PASSWORD: ci-only-redis-password-with-at-least-32-bytes
      GITHUB_WEBHOOK_SECRET: ci-only-github-webhook-secret-with-at-least-32-bytes
      DEPLOYMENT_WEBHOOK_SECRET: ci-only-deployment-webhook-secret-with-at-least-32-bytes
      RDPS_WORKER_SHARED_SECRET: ci-only-worker-shared-secret-with-at-least-32-bytes
      NOTIFICATION_WORKER_SECRET: ci-only-notification-secret-with-at-least-32-bytes
      PUBLIC_BASE_URL: https://releases.example.test
      WEB_BASE_URL: https://admin.example.test
      RDPS_ALERT_WEBHOOK_URL: https://alerts.example.test/rdps
      RDPS_PRODUCTION_API_HEALTH_URL: https://api.example.test/api/v1/health/ready
      RDPS_PRODUCTION_WEB_HEALTH_URL: https://releases.example.test/healthz
      RDPS_PRODUCTION_PUBLIC_URL: https://releases.example.test/
      RDPS_PRODUCTION_SITEMAP_URL: https://releases.example.test/sitemap.xml
      RDPS_PRODUCTION_ADMIN_URL: https://admin.example.test/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install headless Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/rdps
        run: pnpm --filter @rdps/api db:generate
      - name: Check formatting
        run: pnpm format:check
      - name: Lint workspace
        run: pnpm lint
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Run workspace tests
        run: pnpm test
      - name: Run isolated browser smoke and collect raw axe audits
        run: pnpm test:browser
      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-results
          path: |
            scripts/browser-tests/test-results/
            scripts/browser-tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify attachment backup and restore safety
        run: bash scripts/operations/test-attachment-backup.sh
      - name: Verify Docker attachment volume backup and restore
        run: bash scripts/operations/test-attachment-volume-roundtrip.sh
      - name: Install PostgreSQL client tools for backup verification
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify isolated PostgreSQL backup and restore
        run: bash scripts/operations/test-postgres-restore-roundtrip.sh
      # Starts its own PostgreSQL, Redis, API, worker, deployment runner and sandbox target with
      # generated secrets, bootstraps an administrator and runs scripts/e2e/full-publish-flow.mjs.
      - name: Run invite-to-publication end-to-end flow
        run: pnpm e2e:isolated-publish
      - name: Build workspace
        run: pnpm build

      - name: Validate production Compose configuration
        run: docker compose --file docker-compose.production.yml config --quiet
      - name: Run production secret and URL preflight
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@postgres.production.example.test:5432/rdps?sslmode=require
          REDIS_URL: redis://:ci-only-redis-password-with-at-least-32-bytes@redis.production.example.test:6379
          DEPLOYMENT_RUNNER_URL: https://runner.example.test/rdps/dispatch
          DEPLOYMENT_RUNNER_SIGNING_SECRET: ci-only-deployment-runner-signing-secret-32-bytes
        run: bash scripts/ops/production-preflight.sh
      - name: Confirm restore refuses the development database URL
        env:
          RDPS_RESTORE_DATABASE_URL: postgresql://rdps:rdps_dev_only@postgres:5432/rdps?schema=public
          RDPS_RESTORE_CONFIRM: YES
        run: |
          if bash scripts/ops/restore-postgres-safe.sh /tmp/nonexistent.dump; then
            echo "Restore safety check unexpectedly accepted the development database URL" >&2
            exit 1
          else
            test "$?" -eq 64
          fi

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: api
          push: false
          tags: rdps-api:ci
          cache-from: type=gha,scope=rdps-production
          cache-to: type=gha,scope=rdps-production,mode=max
      - name: Build worker runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: worker
          push: false
          tags: rdps-worker:ci
          cache-from: type=gha,scope=rdps-production
          cache-to: type=gha,scope=rdps-production,mode=max
      - name: Build one-shot migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: migrate
          push: false
          tags: rdps-migrate:ci
          cache-from: type=gha,scope=rdps-production
          cache-to: type=gha,scope=rdps-production,mode=max
      - name: Build non-root Alertmanager runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: alertmanager
          push: false
          load: true
          tags: rdps-alertmanager:ci
          cache-from: type=gha,scope=rdps-production
          cache-to: type=gha,scope=rdps-production,mode=max
      - name: Validate rendered Alertmanager webhook configuration
        env:
          RDPS_ALERT_WEBHOOK_URL: https://alerts.example.test/rdps
        run: docker run --rm -e RDPS_ALERT_WEBHOOK_URL rdps-alertmanager:ci /bin/amtool check-config /tmp/alertmanager.yml
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/scripts/ops/monitoring:/etc/prometheus:ro" prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/scripts/ops/monitoring:/etc/prometheus:ro" prom/prometheus:v3.16.0 check rules /etc/prometheus/alerts.yml
      - name: Build web and Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: web
          push: false
          load: true
          tags: rdps-web:ci
          cache-from: type=gha,scope=rdps-production
          cache-to: type=gha,scope=rdps-production,mode=max
      - name: Validate Nginx production configuration
        run: docker run --rm rdps-web:ci nginx -t
