worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $host $rdps_api_upstream {
        default api:3001;
    }

    map $http_x_forwarded_proto $rdps_forwarded_proto {
        default $scheme;
        https   https;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html/public;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
        }

        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
        }

        location = / {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
        }

        location /api/ {
            proxy_pass http://$rdps_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ @public_metadata;
        }

        location @public_metadata {
            proxy_pass http://127.0.0.1:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
    }

    # Point the internal portal DNS name (for example admin.example.com) at
    # this same listener. Vite emits root-relative assets, so it is served at /
    # on its own host instead of under a path prefix.
    server {
        listen 8080;
        server_name ~^admin\.;
        root /usr/share/nginx/html/admin;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://$rdps_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $rdps_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
    }
}
