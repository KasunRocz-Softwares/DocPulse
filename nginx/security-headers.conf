add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Google Fonts: the admin UI and per-project public page fonts load stylesheets
# from fonts.googleapis.com and font files from fonts.gstatic.com.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'" always;
# Enable HSTS only after TLS is terminated here or the trusted ingress guarantees HTTPS.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
